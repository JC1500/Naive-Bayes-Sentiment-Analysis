<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1da1f2 0%, #003566 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: #1da1f2;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            resize: none;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #1da1f2;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #aaa;
            margin: 4px 0 0;
        }

        .char-counter.warn { color: #e0a800; }
        .char-counter.over { color: #dc3545; }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #1a91da;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #90cdf4;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            animation: fadeIn 0.5s ease;
        }

        .result-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }

        .positive {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .negative {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🐦 Twitter Sentiment AI</h2>
    <p>Enter a tweet below to analyze its emotional tone.</p>

    <form method="POST" action="/" id="sentimentForm">
        <textarea
            name="tweet_text"
            id="tweetInput"
            placeholder="What's happening?"
            maxlength="500"
            required
        >{{ tweet_text if tweet_text }}</textarea>

        <div class="char-counter" id="charCounter">0 / 500</div>

        <button type="submit" id="submitBtn" disabled>Analyze Sentiment</button>
    </form>

    {% if prediction %}
        <div class="result {% if prediction == 'Positive' %}positive{% else %}negative{% endif %}">
            <span class="result-icon">{% if prediction == 'Positive' %}😊{% else %}😞{% endif %}</span>
            <strong>Analysis:</strong> This tweet feels <strong>{{ prediction }}</strong>.
        </div>
    {% endif %}
</div>

<script>
    const textarea = document.getElementById('tweetInput');
    const counter  = document.getElementById('charCounter');
    const btn      = document.getElementById('submitBtn');
    const form     = document.getElementById('sentimentForm');

    function updateCounter() {
        const len = textarea.value.length;
        counter.textContent = len + ' / 500';
        counter.className = 'char-counter' + (len >= 500 ? ' over' : len >= 450 ? ' warn' : '');
        btn.disabled = len === 0;
    }

    textarea.addEventListener('input', updateCounter);
    updateCounter();

    form.addEventListener('submit', () => {
        btn.textContent = 'Analyzing…';
        btn.disabled = true;
    });
</script>
</body>
</html>
